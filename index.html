<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Cinefilum — Watch Movies, TV Shows & Anime Online Free</title>
    <meta name="description" content="Cinefilum is a free movie & TV streaming discovery platform. Watch movies, TV series, and anime online. Get AI-powered recommendations and watch together with friends in real time." />
    <meta name="keywords" content="watch movies online free, watch anime online, TV shows streaming, movie recommendations, watch together, cinefilum, free streaming, anime series" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cinefilum.vercel.app/" />

    <!-- Open Graph (Facebook, WhatsApp, Telegram) -->
    <meta property="og:title" content="Cinefilum — Watch Movies, TV Shows & Anime Online Free" />
    <meta property="og:description" content="Free movie & anime streaming platform with personalized recommendations and Watch Together rooms." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cinefilum.vercel.app/" />
    <meta property="og:image" content="https://cinefilum.vercel.app/og-image.png" />
    <meta property="og:site_name" content="Cinefilum" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cinefilum — Watch Movies, TV Shows & Anime Free" />
    <meta name="twitter:description" content="Stream movies, TV series & anime. Get AI recommendations and watch with friends." />
    <meta name="twitter:image" content="https://cinefilum.vercel.app/og-image.png" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cinefilum",
      "url": "https://cinefilum.vercel.app",
      "description": "Free movie, TV show and anime streaming discovery platform with Watch Together rooms.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cinefilum.vercel.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
